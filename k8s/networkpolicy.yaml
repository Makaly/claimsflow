# Default-deny ingress for the namespace, then explicitly allow only the flows we need.
# Postgres/Redis are external (managed) services, so they are not selectable here;
# restrict their reachability at the cloud firewall / security group instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: claimsflow
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # No ingress rules => deny all ingress unless another policy allows it.
---
# Backend only accepts traffic from the frontend pods (on its HTTP port).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: claimsflow
spec:
  podSelector:
    matchLabels:
      app: claimsflow
      component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: claimsflow
              component: frontend
      ports:
        - protocol: TCP
          port: 4000
---
# Frontend accepts traffic from the ingress controller (and same-namespace probes).
# Adjust the namespaceSelector label to match your ingress controller's namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: claimsflow
spec:
  podSelector:
    matchLabels:
      app: claimsflow
      component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
