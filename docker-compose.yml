version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cic_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cic_claims}
    # Bound to loopback only — reachable from the host (migrations/psql) but never
    # published on the network. Internal services use the cic_network DNS name.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cic_network

  # Redis for BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: cic_redis
    restart: always
    # Loopback-only; internal services reach Redis via the cic_network DNS name.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cic_network
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 60
      --timeout 300

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cic_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cic_claims}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env (32+ random bytes)}
      JWT_EXPIRES_IN: "7d"
      PORT: 4000
      API_PREFIX: "api"
      ML_SIDECAR_URL: "http://ml-sidecar:8000"
      ML_SIDECAR_API_KEY: ${ML_SIDECAR_API_KEY:?set ML_SIDECAR_API_KEY in .env}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    networks:
      - cic_network
    command: npm run start:dev

  # ML Fraud Scoring Sidecar (Python / scikit-learn)
  ml-sidecar:
    build:
      context: ./ml-sidecar
      dockerfile: Dockerfile
    container_name: cic_ml_sidecar
    restart: always
    # No published port — only the backend reaches it via the internal cic_network
    # (http://ml-sidecar:8000). Access is additionally gated by ML_SIDECAR_API_KEY.
    expose:
      - "8000"
    environment:
      MODEL_PATH: /data/fraud_model.pkl
      ML_SIDECAR_API_KEY: ${ML_SIDECAR_API_KEY:?set ML_SIDECAR_API_KEY in .env}
    volumes:
      - ml_model_data:/data
    networks:
      - cic_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cic_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cic_network
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
  uploads:
  ml_model_data:

networks:
  cic_network:
    driver: bridge
